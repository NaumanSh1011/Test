name: Build virtual SCO AIDL module (free runner)

# Builds virtualsco/ (the android.hardware.audio.core IModule/virtual service) on a standard
# GitHub-hosted Ubuntu runner, tuned to stay inside the ~70 GB disk bracket:
#   - builds on /mnt (the runner's large scratch disk), not the cramped /
#   - frees the preinstalled toolchains first
#   - CURATED sync: repo init (metadata only) then `repo sync` ONLY the listed projects
#   - SOONG_ALLOW_MISSING_DEPENDENCIES=true so Soong tolerates everything outside the target's path
#   - caches .repo + out so first-run tuning iterations are cheap
#
# FIRST-RUN TUNING: if the build errors "module \"X\" not found / no such file", find the git
# project that provides X, add it to the `projects` input, and re-run. After ~1-2 passes the list is
# complete; keep it as your default. This is the one-time cost of the free path.

on:
  workflow_dispatch:
    inputs:
      aosp_branch:
        description: "AOSP manifest branch/tag (match the target device's Android version)"
        required: true
        default: "android-15.0.0_r36"
      lunch_target:
        description: "lunch target"
        required: true
        default: "aosp_arm64-trunk_staging-userdebug"
      projects:
        description: "Space/newline-separated repo projects to sync (curated). Extend on missing-module errors."
        required: true
        default: >-
          build/soong build/make build/blueprint build/bazel build/release
          prebuilts/build-tools prebuilts/clang/host/linux-x86 prebuilts/go/linux-x86
          prebuilts/jdk/jdk21 prebuilts/sdk prebuilts/misc prebuilts/rust prebuilts/clang-tools
          prebuilts/vndk/v30 prebuilts/vndk/v31 prebuilts/vndk/v32 prebuilts/vndk/v33 prebuilts/vndk/v34
          toolchain/pgo-profiles
          bionic system/core system/libbase system/logging system/tools/aidl system/libfmq
          system/tools/hidl system/tools/xsdc
          system/memory/libmemunreachable system/unwinding system/sepolicy
          hardware/interfaces hardware/libhardware hardware/libhardware_legacy
          frameworks/native frameworks/av
          external/googletest external/fmtlib external/jsoncpp external/tinyxml2 external/expat
          external/libcxx external/libcxxabi external/compiler-rt external/zlib external/boringssl
          external/libcap external/pcre external/selinux external/jemalloc_new external/lzma
          external/go-cmp external/golang-protobuf external/starlark-go external/spdx-tools
          external/avb
          kernel/configs
      sync_jobs:
        description: "repo sync parallelism"
        required: false
        default: "6"

permissions:
  contents: read

# One build at a time; a new run cancels any in-progress one (so a re-trigger supersedes a stuck run).
concurrency:
  group: build-virtualsco
  cancel-in-progress: true

env:
  AOSP_ROOT: /mnt/aosp
  MODULE_DEST_REL: vendor/aicaller/virtualsco
  TARGET: android.hardware.audio.service-aidl.virtualsco

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out this repo (has virtualsco/)
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Prepare /mnt build area
        run: |
          sudo mkdir -p "$AOSP_ROOT"
          sudo chown "$USER" "$AOSP_ROOT"
          df -h "$AOSP_ROOT"

      - name: Install AOSP build dependencies + repo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python-is-python3 rsync
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global color.ui false

      # No actions/cache: a synced AOSP subset (with multi-GB prebuilts/clang) far exceeds GitHub's
      # 10 GB cache limit, so the save silently fails. We keep the sync fast (batch) instead.

      - name: Full manifest sync (partial clone, shallow)
        run: |
          cd "$AOSP_ROOT"
          repo init -u https://android.googlesource.com/platform/manifest \
            -b "${{ inputs.aosp_branch }}" --partial-clone --depth=1 --no-tags
          # FULL sync of the whole manifest. The curated/partial-tree approach hit the Java-analysis
          # wall (Soong analyzes every parsed module; required projects like hardware/interfaces and
          # frameworks/native drag in -java/android_common modules that nil-panic without the full
          # platform). A complete tree analyzes cleanly, like a normal AOSP build. Partial clone +
          # depth 1 keep it as small as a full checkout can be.
          echo "Full manifest sync… (this is the long step)"
          heartbeat() { while :; do sleep 60; echo "… sync alive: ${SECONDS}s elapsed, $(df -h --output=used,avail "$AOSP_ROOT" 2>/dev/null | tail -1)"; done; }
          heartbeat & HB=$!
          repo sync -c --no-clone-bundle --optimized-fetch --force-sync --prune -j"${{ inputs.sync_jobs }}"; RC=$?
          kill $HB 2>/dev/null || true
          if [ $RC -ne 0 ]; then
            echo "::error::full sync failed (rc=$RC). If disk-related, this free runner (~145 GB) may be too small for a full AOSP tree — use a larger runner."
            df -h "$AOSP_ROOT"; exit $RC
          fi
          echo "full sync OK in ${SECONDS}s"
          echo "=== disk after sync ==="; df -h "$AOSP_ROOT"; du -sh "$AOSP_ROOT" 2>/dev/null || true

      - name: Stage virtualsco module into the tree
        run: |
          DEST="$AOSP_ROOT/$MODULE_DEST_REL"
          mkdir -p "$DEST"
          rsync -a --delete "$GITHUB_WORKSPACE/virtualsco/" "$DEST/"
          ls -R "$DEST"

      - name: Build the module (tolerating missing unrelated projects)
        run: |
          cd "$AOSP_ROOT"
          export OUT_DIR="$AOSP_ROOT/out"
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_MISSING_REQUIRED_MODULES=true
          set +u
          source build/envsetup.sh
          # Don't mask the real cause — lunch failures here are usually a missing config-time project
          # (rbcrun/starlark, product configs). The actual error prints above this line.
          # Soong analyzes every PARSED module when generating the ninja graph (not just our target's
          # deps), so partial-tree analysis errors are handled two ways: sync the projects our target
          # needs, and PRUNE (below/earlier) the product modules that panic but we don't build.
          # NOTE: banchan/module_arm64 was tried and is worse here — it additionally analyzes module-SDK
          # export modules (e.g. runtime-module-host-exports) that panic. The plain phone product does
          # not, so we use lunch.
          echo "=== lunch ${{ inputs.lunch_target }} ==="
          if ! lunch "${{ inputs.lunch_target }}"; then
            echo "::error::lunch/config failed — see the error just above (often a missing project to add to 'projects', or a module to add to PRUNE)"
            exit 3
          fi
          set -u
          echo "=== building $TARGET ==="
          echo "(Soong analysis runs first and can be quiet for several minutes; then ninja prints [n/total].)"
          # Heartbeat for the quiet Soong-analysis phase.
          heartbeat() { while :; do sleep 60; echo "… build alive: ${SECONDS}s elapsed, $(df -h --output=avail "$AOSP_ROOT" 2>/dev/null | tail -1) free"; done; }
          heartbeat & HB=$!
          set +e
          m "$TARGET"; RC=$?
          set -e
          kill $HB 2>/dev/null || true
          echo "=== m exited rc=$RC after ${SECONDS}s ==="
          df -h "$AOSP_ROOT"
          exit $RC

      - name: Collect artifacts
        if: always()
        run: |
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUT"
          # Prefer the installed vendor/bin/hw copy; fall back to any built ELF of that name (banchan
          # puts it under a different out/ path than a full product build).
          BIN="$(find "$AOSP_ROOT/out" -type f -name "$TARGET" -path '*/vendor/bin/hw/*' 2>/dev/null | head -1)"
          [ -n "$BIN" ] || BIN="$(find "$AOSP_ROOT/out" -type f -name "$TARGET" -exec sh -c 'file "$1" | grep -q ELF' _ {} \; -print 2>/dev/null | head -1)"
          [ -n "$BIN" ] || BIN="$(find "$AOSP_ROOT/out" -type f -name "$TARGET" 2>/dev/null | head -1)"
          if [ -n "$BIN" ]; then cp -f "$BIN" "$OUT"/; fi
          cp -f "$GITHUB_WORKSPACE/virtualsco/virtualsco.rc" "$GITHUB_WORKSPACE/virtualsco/virtualsco.xml" "$OUT"/ 2>/dev/null || true
          {
            echo "target: $TARGET"
            echo "branch: ${{ inputs.aosp_branch }}"
            echo "lunch: ${{ inputs.lunch_target }}"
            echo "binary: ${BIN:-NOT FOUND}"
            [ -n "$BIN" ] && { echo -n "arch: "; readelf -h "$BIN" 2>/dev/null | sed -n 's/.*Machine:  *//p'; }
            [ -n "$BIN" ] && { echo -n "size: "; du -h "$BIN" | cut -f1; }
            echo "built: $(date -u +%FT%TZ)"
          } > "$OUT/build-info.txt"
          cat "$OUT/build-info.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualsco-aidl-${{ inputs.aosp_branch }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
